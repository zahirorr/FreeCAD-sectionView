        fill="#3a3a4a" stroke="#5a5a7a" stroke-width="1.5"/>
  <!-- Cut-plane (teal) -->
  <rect x="25" y="8" width="4" height="48" rx="2" ry="2"
        fill="#00c8a0" opacity="0.9"/>
  <!-- Left half – solid -->
  <rect x="6" y="14" width="19" height="36" rx="3" ry="3"
        fill="#5b8dd9" opacity="0.85"/>
  <!-- Arrow indicating ON direction -->
  <polygon points="44,32 56,26 56,38" fill="#00c8a0"/>
  <line x1="27" y1="32" x2="54" y2="32" stroke="#00c8a0" stroke-width="2.5"/>
</svg>
