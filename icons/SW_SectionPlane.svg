<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Plane grid -->
  <polygon points="8,48 28,18 56,18 36,48" fill="#3a4a6a" opacity="0.7"/>
  <polygon points="8,48 28,18 56,18 36,48" fill="none"
           stroke="#5b8dd9" stroke-width="1.8"/>
  <!-- Grid lines -->
  <line x1="18" y1="33" x2="46" y2="33" stroke="#5b8dd9" stroke-width="0.8" opacity="0.6"/>
  <line x1="32" y1="18" x2="22" y2="48" stroke="#5b8dd9" stroke-width="0.8" opacity="0.6"/>
  <!-- Normal arrow -->
  <line x1="32" y1="33" x2="32" y2="8" stroke="#00c8a0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="32,4 27,14 37,14" fill="#00c8a0"/>
  <!-- Corner handles -->
  <circle cx="8"  cy="48" r="3" fill="#f5a623"/>
  <circle cx="28" cy="18" r="3" fill="#f5a623"/>
  <circle cx="56" cy="18" r="3" fill="#f5a623"/>
  <circle cx="36" cy="48" r="3" fill="#f5a623"/>
</svg>
