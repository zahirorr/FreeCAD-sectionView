  <line x1="45" y1="40" x2="45" y2="44" stroke="#aaa" stroke-width="1.5"/>
  <!-- Arrow showing offset -->
  <line x1="31" y1="32" x2="42" y2="32" stroke="#c47be0" stroke-width="2" stroke-dasharray="3,2"/>
